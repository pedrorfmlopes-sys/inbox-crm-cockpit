services:
  - type: web
    name: inbox-cockpit-staging
    env: node
    plan: free
    region: frankfurt
    buildCommand: echo "Building server only..." && npm install --workspace=server
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: AI_ENABLED
        value: "1"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_PASS
        sync: false
    healthCheckPath: /health
