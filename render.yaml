services:
  - type: web
    name: inbox-cockpit-staging
    env: node
    plan: free
    region: frankfurt
    buildCommand: ./render-build.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: AI_ENABLED
        value: "1"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_FAST
        value: gpt-4o-mini
      - key: OPENAI_MODEL_QUALITY
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_FAST
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_QUALITY
        value: gemini-2.5-pro
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USERNAME
        sync: false
      - key: ODOO_API_KEY
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_PASSWORD
        sync: false
      - key: ODOO_PASS
        sync: false
    healthCheckPath: /health
